; PlatformIO Project Configuration File
;
; Board: generic ESP32 dev module. If you're using an ESP32-S3 or ESP32-C3
; board, change the [env:esp32dev] section name and the `board` line below
; to match (e.g. board = esp32-s3-devkitc-1, board = esp32-c3-devkitm-1).

[env:esp32dev]
; This toolchain resolves "espressif32" through the pioarduino community
; registry (the continuation of platform-espressif32 past where the
; official PlatformIO registry stopped receiving updates). Pinning the
; bare name floated to their newest release with a broken package split
; (framework-arduinoespressif32 vs -libs did not resolve together), which
; crashes the build with a NoneType path error. Pointing at their
; documented "stable" release avoids that ambiguity.
; See: https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    scottp/victronble
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
